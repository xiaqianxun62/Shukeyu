server:
  port: 8080
  servlet:
    # 全站接口统一前缀：/auth、/games 等 → /api/auth、/api/games（静态资源 /uploads 同步变为 /api/uploads）
    context-path: /api
  tomcat:
    # 让 access log 落到进程工作目录下的 logs/，而不是临时目录
    basedir: .
    accesslog:
      # 记录每次请求的后端处理耗时（%D=毫秒），用来区分「后端慢」还是「小程序/工具链路慢」
      enabled: true
      directory: logs
      prefix: access
      suffix: .log
      pattern: "%t %a \"%r\" %s %Dms"


spring:
  application:
    name: yuyue-backend
  datasource:
    url: jdbc:mariadb://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/yuyue?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:265147}
    password: ${MYSQL_PASSWORD:265147}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  # Flyway 负责建表；数据库由上面的 createDatabaseIfNotExist=true 自动创建
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    # 已有表但无迁移记录时自动建立基线，避免报错
    baseline-on-migrate: true
    # 允许迁移版本号不连续、跳过缺少的orphan 记录
    validate-on-migrate: false
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  # 热部署（仅开发期；生产 jar 不含 devtools，自动失效）
  devtools:
    restart:
      enabled: true
      # 观察 target/classes 的变更，IDE 编译（Ctrl+F9）后即触发重启
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
  # multipart 文件上传：个人头像上传接口
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      # 显式指定临时文件目录，绕开 Tomcat 默认按 context-path 拼的
      # /work/Tomcat/localhost/api（宝塔面板下该路径无权限创建，导致所有 multipart 解析失败）。
      # 临时目录和业务上传目录统一放在宝塔 uploads 下，子目录 tmp/ 隔离，
      # 避免 Spring Boot 自动创建 /api 子目录的权限问题。
      location: /www/wwwroot/uploads/tmp
      #location: /uploads

# Swagger UI: http://localhost:8080/swagger-ui.html   OpenAPI JSON: /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha          # 接口按标签字母序
    operations-sorter: method   # 接口按请求方法排序
    display-request-duration: true
    doc-expansion: none         # 默认折叠，接口多时更清爽
    persist-authorization: true # Authorize 里填的 token 写入 localStorage，刷新页面不丢

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

yuyue:
  swagger:
    auto-auth:
      # 给 Swagger UI 注入自动登录脚本：登录成功后自动持有 JWT
      enabled: ${SWAGGER_AUTO_AUTH:true}
  jwt:
    secret: ${JWT_SECRET:yuyue-dev-secret-key-change-in-production-0123456789}
    expire-hours: 72
  wx:
    # 微信小程序：填上真实 appid / secret 才能真机登录；留空时只能用 mock code 联调
    appid: wxd3c7f28a9a1d58e2
    secret: 6fd23580cb5da95b091596140c4c30fa
    mock-enabled: ${WX_MOCK_ENABLED:true}
  elo:
    default-rating: 1200
    k-new: 40       # ≤20 场
    k-mid: 24       # 21-60 场
    k-pro: 16       # >60 场
    # 性别修正：跨赛制对局按双方性别构成折算 handicap（正=吃亏 负=占便宜）
    gender-adjust-enabled: true
    male-vs-female-edge: 100   # 男生面对女生时的天然优势（分）
    female-vs-male-edge: 100   # 女生面对男生时的天然劣势（分）
    # 局内分差动态调整：净胜分越多胜方多得越多，胜加负减同额、严格零和
    margin-bonus-enabled: true
    margin-win-score: 21       # 一局满分，净胜分以此为满格
    margin-floor: 0.25         # 触发线，净胜 5 分以内不触发加成
    margin-bonus-rate: 0.5     # 打满时胜方额外拿 K × 0.5 分
  # 个人头像上传：保存目录、对外 URL 前缀、单文件大小上限
  upload:
    # 生产环境统一用宝塔 uploads 目录（与 nginx 静态映射、multipart 临时目录同根）；
    # 本地开发没这个绝对路径时 UserService 里 createDirectories 会自动创建。
    dir: /www/wwwroot/uploads
    url-prefix: /uploads
    max-size: 10485760

logging:
  level:
    # Spring 对「已被 @ExceptionHandler 处理」的异常仍会打一条 Resolved [...] WARN，
    # 401 / 参数校验失败属于预期内的业务异常，不必刷屏（真正的堆栈由 handleOther 打 error）
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    # 想看是哪个接口 401，把这行改成 DEBUG，日志会打印 method + uri
    com.yuyue.web.AuthInterceptor: WARN
